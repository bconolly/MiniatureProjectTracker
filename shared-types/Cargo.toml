[package]
name = "shared-types"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Database support
# default-features = false drops the unused `any` and `json` features (and avoids
# pulling sqlx-mysql / rsa into the dep tree — RUSTSEC-2023-0071).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "macros"] }