[package]
name = "miniature-painting-tracker-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "request-id"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
# default-features = false drops the unused `any` and `json` features (and avoids
# pulling sqlx-mysql / rsa into the dep tree — RUSTSEC-2023-0071).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "migrate", "macros"] }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File upload handling
multer = "3.0"

# AWS SDK (for S3 storage)
# aws-sdk-s3's default `rustls` feature pulls in legacy hyper-rustls 0.24 /
# rustls 0.21 / rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). Drop it
# and keep `default-https-client` which uses the modern rustls-aws-lc chain.
aws-config = "1.0"
aws-sdk-s3 = { version = "1.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio", "behavior-version-latest"] }

# Async trait support
async-trait = "0.1"

# Shared types
shared-types = { path = "../shared-types" }

# Testing
[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"
futures = "0.3"